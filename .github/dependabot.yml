# Weekly dependency update PRs.
# - Minor/patch updates are grouped into one PR per ecosystem.
# - Major updates get their own PRs (they may need code changes).
# - cooldown: wait 7 days after a release before proposing it, so a
#   compromised release has time to be caught and pulled from the registry.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # A package goes to the first group that matches, so the
    # "must move together" groups come before the catch-all.
    groups:
      # @mantine/core and @mantine/hooks must always be on the same
      # version: one PR for all of them, majors included.
      mantine:
        patterns: ["@mantine/*"]
      # Same for react and react-dom (and their types).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
